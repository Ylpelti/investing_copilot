

services:
  db:
    image: postgres:16
    container_name: postgres_dev
    environment:
      POSTGRES_DB: myapp_dev
      POSTGRES_USER: myapp_user
      POSTGRES_PASSWORD: myapp_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
